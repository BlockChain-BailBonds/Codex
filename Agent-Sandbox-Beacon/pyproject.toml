[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-beacon"
version = "0.1.0"
description = "Externally observable agent location beacons with geofenced, revocable capability leases."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "918 Technologies"}]
keywords = ["ai-agent", "sandbox", "containment", "geofence", "security", "capabilities"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
asb = "asb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
