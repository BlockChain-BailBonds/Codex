name: Build CYDroid single-file flasher

on:
  push:
    branches: [cydroid-singlefile-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct CYDroid source
        shell: bash
        run: |
          set -euo pipefail
          cat cydroid-singlefile-src.part00 cydroid-singlefile-src.part01 cydroid-singlefile-src.part02 cydroid-singlefile-src.part03 cydroid-singlefile-src.part04 > cydroid-singlefile-src.b64
          base64 -d cydroid-singlefile-src.b64 > cydroid-singlefile-src.tar.gz
          echo 'c1bd8977ea819e2a85f0444b6adace3135dc77b42d7bc8951d5db88a1861f8ce  cydroid-singlefile-src.tar.gz' | sha256sum -c -
          mkdir -p cydroid-single-file
          tar -xzf cydroid-singlefile-src.tar.gz -C cydroid-single-file
          mkdir -p cydroid-single-file/.github/workflows
          cp .github/workflows/cydroid-singlefile-build.yml cydroid-single-file/.github/workflows/build-single-file.yml

      - name: Rotate CYD touch another 90 degrees clockwise
        shell: bash
        run: |
          set -euo pipefail
          cat > cydroid-single-file/src/board/TouchTransform.h <<'HPP'
          #pragma once
          #include <cstdint>
          namespace cydtouch {
          struct Point { int16_t x; int16_t y; };
          inline int32_t clampInt(int32_t v,int32_t lo,int32_t hi){return v<lo?lo:(v>hi?hi:v);}
          inline int16_t scaleRaw(int32_t raw,int32_t rawMin,int32_t rawMax,int32_t outMax){
            raw=clampInt(raw,rawMin,rawMax);
            const int64_t num=int64_t(raw-rawMin)*outMax;
            const int64_t den=rawMax-rawMin;
            return static_cast<int16_t>(den>0?num/den:0);
          }
          inline Point mapRawClockwise180(int32_t rawX,int32_t rawY,int32_t rawXMin,int32_t rawXMax,int32_t rawYMin,int32_t rawYMax,int32_t screenW,int32_t screenH){
            return {
              static_cast<int16_t>((screenW-1)-scaleRaw(rawY,rawYMin,rawYMax,screenW-1)),
              scaleRaw(rawX,rawXMin,rawXMax,screenH-1)
            };
          }
          }
          HPP
          python - <<'PY'
          from pathlib import Path
          p=Path('cydroid-single-file/src/board/Touch.cpp')
          s=p.read_text()
          s=s.replace('#include "BoardConfig.h"\n#include <algorithm>', '#include "BoardConfig.h"\n#include "TouchTransform.h"')
          old='''  long mx=map(rawY,boardcfg::TOUCH_RAW_Y_MIN,boardcfg::TOUCH_RAW_Y_MAX,0,boardcfg::SCREEN_W-1);\n  long my=map(rawX,boardcfg::TOUCH_RAW_X_MIN,boardcfg::TOUCH_RAW_X_MAX,boardcfg::SCREEN_H-1,0);\n  x=(int16_t)std::max(0L,std::min((long)boardcfg::SCREEN_W-1,mx));\n  y=(int16_t)std::max(0L,std::min((long)boardcfg::SCREEN_H-1,my));'''
          new='''  const auto point=cydtouch::mapRawClockwise180(\n    rawX,rawY,\n    boardcfg::TOUCH_RAW_X_MIN,boardcfg::TOUCH_RAW_X_MAX,\n    boardcfg::TOUCH_RAW_Y_MIN,boardcfg::TOUCH_RAW_Y_MAX,\n    boardcfg::SCREEN_W,boardcfg::SCREEN_H);\n  x=point.x;\n  y=point.y;'''
          if old not in s: raise SystemExit('old touch mapping not found')
          p.write_text(s.replace(old,new))
          PY
          cat > cydroid-single-file/test_host/test_touch_transform.cpp <<'CPP'
          #include <cassert>
          #include "board/TouchTransform.h"
          int main(){
            constexpr int xmin=220,xmax=3850,ymin=220,ymax=3850,w=320,h=240;
            auto tl=cydtouch::mapRawClockwise180(xmin,ymin,xmin,xmax,ymin,ymax,w,h);
            auto tr=cydtouch::mapRawClockwise180(xmax,ymin,xmin,xmax,ymin,ymax,w,h);
            auto bl=cydtouch::mapRawClockwise180(xmin,ymax,xmin,xmax,ymin,ymax,w,h);
            auto br=cydtouch::mapRawClockwise180(xmax,ymax,xmin,xmax,ymin,ymax,w,h);
            assert(tl.x==w-1&&tl.y==0); assert(tr.x==w-1&&tr.y==h-1);
            assert(bl.x==0&&bl.y==0); assert(br.x==0&&br.y==h-1);
            return 0;
          }
          CPP

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESP32 build tools
        run: python -m pip install --disable-pip-version-check platformio==6.2.0 esptool==4.9.0

      - name: Build CYDroid firmware
        working-directory: cydroid-single-file
        run: pio run -e cyd

      - name: Merge complete classic ESP32 image
        working-directory: cydroid-single-file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -f "$BOOT_APP0"
          python -m esptool --chip esp32 merge_bin -o build/cydroid-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/cyd/bootloader.bin \
            0x8000 .pio/build/cyd/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/cyd/firmware.bin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle browser flasher
        working-directory: cydroid-single-file
        run: |
          npm install --no-save esptool-js@0.6.1 esbuild
          npx esbuild websrc/flasher-entry.js --bundle --format=iife --platform=browser --target=chrome89 --minify --outfile=build/flasher.bundle.js

      - name: Generate one-file index.html
        working-directory: cydroid-single-file
        run: python scripts/build_single_file.py

      - name: Run contract and native tests
        working-directory: cydroid-single-file
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_host.test_single_file_flasher test_host.test_firmware_contract
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc test_host/test_game_models.cpp src/core/GameModels.cpp -o /tmp/cyd-game-models-test
          /tmp/cyd-game-models-test
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc test_host/test_vs_protocol.cpp src/net/VsProtocol.cpp -o /tmp/cyd-vs-protocol-test
          /tmp/cyd-vs-protocol-test
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc test_host/test_touch_transform.cpp -o /tmp/cyd-touch-transform-test
          /tmp/cyd-touch-transform-test

      - name: Assert exact single-file artifact
        working-directory: cydroid-single-file
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          ! grep -q 'manifest.json' dist/index.html
          ! grep -q '<script src=' dist/index.html
          ! grep -q 'fetch(' dist/index.html
          grep -q 'cydroid-firmware' dist/index.html
          sha256sum dist/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: cydroid-single-file-index-touch180
          path: cydroid-single-file/dist/index.html
          if-no-files-found: error
          retention-days: 7
